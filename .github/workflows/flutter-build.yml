name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.6'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release --verbose > gradle_build.log 2>&1 || {
            echo "=== BUILD FAILED - last 150 lines of gradle log ===";
            tail -150 gradle_build.log;
            echo "=== APK output dir ===";
            find build -name "*.apk" 2>/dev/null || true;
            exit 1;
          }
          echo "=== Build OK, APKs: ==="
          find build -name "*.apk" 2>/dev/null || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            gradle_build.log
          retention-days: 7