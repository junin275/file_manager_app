name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      - name: Backup our Dart code and config
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          cp analysis_options.yaml /tmp/backup/ 2>/dev/null || true

      - name: Create fresh Flutter project structure
        run: |
          cd /tmp
          flutter create -t app --overwrite --platforms=android --project-name=file_manager_app --org=com.example fresh_project
          rm -rf android lib pubspec.yaml analysis_options.yaml test
          cp -r fresh_project/* .
          rm -rf fresh_project
          
      - name: Restore our Dart code and config
        run: |
          cp -r /tmp/backup/lib/* lib/
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/analysis_options.yaml analysis_options.yaml 2>/dev/null || true

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "ALLOWED" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | flutter doctor --android-licenses || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release --verbose > gradle_build.log 2>&1 || {
            echo "=== BUILD FAILED - last 150 lines of gradle log ===";
            tail -150 gradle_build.log;
            echo "=== APK output dir ===";
            find build -name "*.apk" 2>/dev/null || true;
            exit 1;
          }
          echo "=== Build OK, APKs: ==="
          find build -name "*.apk" 2>/dev/null || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            gradle_build.log
          retention-days: 7
