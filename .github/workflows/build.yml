name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable

      - name: Backup our Dart code and config
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          cp -r android/app/src/main/AndroidManifest.xml /tmp/backup/ 2>/dev/null || true
          cp -r android/app/build.gradle.kts /tmp/backup/ 2>/dev/null || true
          cp -r android/settings.gradle.kts /tmp/backup/ 2>/dev/null || true
          cp -r android/build.gradle.kts /tmp/backup/ 2>/dev/null || true

      - name: Create fresh Flutter project in /tmp and copy EVERYTHING
        run: |
          cd /tmp
          flutter create -t app --overwrite --platforms=android --project-name=file_manager_app --org=com.example fresh_project
          # Copy the ENTIRE project structure
          rm -rf android lib pubspec.yaml analysis_options.yaml test
          cp -r fresh_project/* .
          # Clean up temp
          rm -rf fresh_project
          
      - name: Restore our Dart code and config
        run: |
          cp -r /tmp/backup/lib/* lib/
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp /tmp/backup/build.gradle.kts android/app/build.gradle.kts 2>/dev/null || true
          cp /tmp/backup/settings.gradle.kts android/settings.gradle.kts 2>/dev/null || true
          cp /tmp/backup/build.gradle.kts android/build.gradle.kts 2>/dev/null || true

      - name: Get dependencies (after regenerate)
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk