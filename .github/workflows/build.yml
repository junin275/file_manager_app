name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable

      - name: Backup our Dart code
        run: |
          mkdir -p /tmp/backup
          cp -r lib /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          cp analysis_options.yaml /tmp/backup/ 2>/dev/null || true

      - name: Create fresh Flutter project and copy Android structure
        run: |
          cd /tmp
          flutter create -t app --overwrite --platforms=android --project-name=file_manager_app --org=com.example fresh_project
          # Copy ONLY the Android structure (which is fresh and compatible)
          rm -rf android
          cp -r fresh_project/android android
          rm -rf fresh_project

      - name: Restore our Dart code
        run: |
          cp -r /tmp/backup/lib/* lib/
          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/analysis_options.yaml analysis_options.yaml 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}